name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Start the app
        env:
          PYTHONPATH: src
          PDFTOOLBOX_SMOKE_TEST: "2000"
        run: python -m pdftoolbox

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Bundle Tesseract OCR
        shell: pwsh
        run: ./scripts/fetch_tesseract_windows.ps1
      - name: Build the app
        shell: pwsh
        run: |
          $version = python packaging/windows/version_info.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          pyinstaller --noconfirm --clean packaging/pdftoolbox.spec
      - name: Self-test the built app
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\PDF Toolbox\PDF Toolbox.exe" -ArgumentList @("--self-test", "`"$report`"") -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION packaging\windows\installer.iss
      - name: Test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PDFToolbox-*-windows-x64-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          Get-Process "PDF Toolbox" -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $env:LOCALAPPDATA "Programs\PDF Toolbox\PDF Toolbox.exe"
          if (-not (Test-Path $exe)) { throw "The app was not installed to $exe" }
          $report = Join-Path $env:RUNNER_TEMP "installed-selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", "`"$report`"") -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Installed app self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/PDFToolbox-*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS app (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            min_version: "14.0"
          - runner: macos-15-intel
            arch: x64
            min_version: "15.0"
    env:
      MACOS_MIN_VERSION: ${{ matrix.min_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Bundle Tesseract OCR
        run: ./scripts/fetch_tesseract_macos.sh
      - name: Build the app
        run: |
          echo "APP_VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/pdftoolbox/__init__.py').read()).group(1))")" >> "$GITHUB_ENV"
          pyinstaller --noconfirm --clean packaging/pdftoolbox.spec
      - name: Self-test the built app
        run: |
          brew uninstall --ignore-dependencies tesseract || true
          "dist/PDF Toolbox.app/Contents/MacOS/PDF Toolbox" --self-test "$RUNNER_TEMP/selftest.txt"; status=$?
          cat "$RUNNER_TEMP/selftest.txt"
          exit $status
      - name: Build the disk image
        run: ./scripts/make_dmg.sh "$APP_VERSION" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/PDFToolbox-*-macos-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/pdftoolbox/__init__.py').read()).group(1))")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: |
          sha256sum PDFToolbox-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
